services:
  volume-init:
    build: .
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        chown -R 1000:0 /data/storage-1 /data/storage-2 /data/router /data/router-2 &&
        chmod 0700 /data/storage-1 /data/storage-2 /data/router /data/router-2
    volumes:
      - storage-1-data:/data/storage-1
      - storage-2-data:/data/storage-2
      - router-data:/data/router
      - router-2-data:/data/router-2
    restart: "no"

  tarantool-admin:
    image: quay.io/basis-company/tarantool-admin:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      router:
        condition: service_healthy

  storage-1:
    build: .
    user: "1000:0"
    entrypoint: ["env", "-u", "TT_APP_NAME", "-u", "TT_INSTANCE_NAME", "tarantool"]
    command: ["/opt/tarantool/app/storage.lua"]
    environment:
      INSTANCE_UUID: aaaaaaaa-aaaa-4000-b000-000000000001
      REPLICASET_UUID: aaaaaaaa-0000-4000-b000-000000000000
      LISTEN: "0.0.0.0:3301"
    volumes:
      - ./tarantool:/opt/tarantool/app:ro
      - storage-1-data:/var/lib/tarantool
    ports:
      - "3302:3301"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "env", "-u", "TT_APP_NAME", "-u", "TT_INSTANCE_NAME", "tarantool", "/opt/tarantool/app/healthcheck.lua"]
      interval: 2s
      timeout: 2s
      retries: 30

  storage-2:
    build: .
    user: "1000:0"
    entrypoint: ["env", "-u", "TT_APP_NAME", "-u", "TT_INSTANCE_NAME", "tarantool"]
    command: ["/opt/tarantool/app/storage.lua"]
    environment:
      INSTANCE_UUID: bbbbbbbb-bbbb-4000-b000-000000000001
      REPLICASET_UUID: bbbbbbbb-0000-4000-b000-000000000000
      LISTEN: "0.0.0.0:3301"
    volumes:
      - ./tarantool:/opt/tarantool/app:ro
      - storage-2-data:/var/lib/tarantool
    ports:
      - "3303:3301"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "env", "-u", "TT_APP_NAME", "-u", "TT_INSTANCE_NAME", "tarantool", "/opt/tarantool/app/healthcheck.lua"]
      interval: 2s
      timeout: 2s
      retries: 30

  router:
    build: .
    user: "1000:0"
    entrypoint: ["env", "-u", "TT_APP_NAME", "-u", "TT_INSTANCE_NAME", "tarantool"]
    command: ["/opt/tarantool/app/router.lua"]
    environment:
      LISTEN: "0.0.0.0:3301"
    volumes:
      - ./tarantool:/opt/tarantool/app:ro
      - router-data:/var/lib/tarantool
    ports:
      - "3301:3301"
    depends_on:
      storage-1:
        condition: service_healthy
      storage-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "env", "-u", "TT_APP_NAME", "-u", "TT_INSTANCE_NAME", "tarantool", "/opt/tarantool/app/healthcheck.lua"]
      interval: 2s
      timeout: 2s
      retries: 30

  router-2:
    build: .
    user: "1000:0"
    entrypoint: ["env", "-u", "TT_APP_NAME", "-u", "TT_INSTANCE_NAME", "tarantool"]
    command: ["/opt/tarantool/app/router.lua"]
    environment:
      LISTEN: "0.0.0.0:3301"
    volumes:
      - ./tarantool:/opt/tarantool/app:ro
      - router-2-data:/var/lib/tarantool
    ports:
      - "3304:3301"
    depends_on:
      storage-1:
        condition: service_healthy
      storage-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "env", "-u", "TT_APP_NAME", "-u", "TT_INSTANCE_NAME", "tarantool", "/opt/tarantool/app/healthcheck.lua"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  storage-1-data:
  storage-2-data:
  router-data:
  router-2-data:
